[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Network tests are excluded by default: free upstreams go down constantly
# (OpenSky 503s regularly) and a red suite caused by someone else's outage
# trains you to ignore failures. Run them deliberately:
#     pytest -m network
addopts =
    -m "not network"
    --strict-markers
    --tb=short
    -q

markers =
    network: hits a live external API; excluded from the default run
    slow: takes more than a couple of seconds

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
